<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" role="img" aria-label="Beauty Diaries by Mia logo mark">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3f6"/>
      <stop offset=".52" stop-color="#fbdce6"/>
      <stop offset="1" stop-color="#f6bdd0"/>
    </linearGradient>
    <linearGradient id="petal" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#e86a8d"/>
      <stop offset="1" stop-color="#a62b4f"/>
    </linearGradient>
    <linearGradient id="petalLight" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ffc2d4"/>
      <stop offset="1" stop-color="#e88aa5"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#eed188"/>
      <stop offset=".5" stop-color="#c49a3a"/>
      <stop offset="1" stop-color="#a87c2a"/>
    </linearGradient>
  </defs>
  <circle cx="64" cy="64" r="61" fill="url(#bg)"/>
  <circle cx="64" cy="64" r="60" fill="none" stroke="url(#gold)" stroke-width="3"/>
  <circle cx="64" cy="64" r="53.5" fill="none" stroke="#ffffff" stroke-opacity=".7" stroke-width="1.4"/>
  <!-- sparkles -->
  <path d="M95.5 24.5l2.4 6.3 6.3 2.4-6.3 2.4-2.4 6.3-2.4-6.3-6.3-2.4 6.3-2.4z" fill="url(#gold)"/>
  <path d="M25.5 78.5l1.7 4.5 4.5 1.7-4.5 1.7-1.7 4.5-1.7-4.5-4.5-1.7 4.5-1.7z" fill="url(#gold)" opacity=".95"/>
  <path d="M101 76.5l1.3 3.5 3.5 1.3-3.5 1.3-1.3 3.5-1.3-3.5-3.5-1.3 3.5-1.3z" fill="#b98a2e"/>
  <!-- flower: five rounded petals -->
  <g transform="translate(64 65)">
    <g fill="url(#petal)">
      <path d="M0 4C-15-1-19-17 0-30 19-17 15-1 0 4Z"/>
      <path d="M0 4C-15-1-19-17 0-30 19-17 15-1 0 4Z" transform="rotate(72)"/>
      <path d="M0 4C-15-1-19-17 0-30 19-17 15-1 0 4Z" transform="rotate(144)"/>
      <path d="M0 4C-15-1-19-17 0-30 19-17 15-1 0 4Z" transform="rotate(216)"/>
      <path d="M0 4C-15-1-19-17 0-30 19-17 15-1 0 4Z" transform="rotate(288)"/>
    </g>
    <g fill="url(#petalLight)" transform="rotate(36) scale(.58)">
      <path d="M0 4C-15-1-19-17 0-30 19-17 15-1 0 4Z"/>
      <path d="M0 4C-15-1-19-17 0-30 19-17 15-1 0 4Z" transform="rotate(72)"/>
      <path d="M0 4C-15-1-19-17 0-30 19-17 15-1 0 4Z" transform="rotate(144)"/>
      <path d="M0 4C-15-1-19-17 0-30 19-17 15-1 0 4Z" transform="rotate(216)"/>
      <path d="M0 4C-15-1-19-17 0-30 19-17 15-1 0 4Z" transform="rotate(288)"/>
    </g>
    <circle r="7.5" fill="url(#gold)" stroke="#fff7e0" stroke-width="1.6"/>
    <circle r="3" fill="#fff3f6"/>
  </g>
</svg>
